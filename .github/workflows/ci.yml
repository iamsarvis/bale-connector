name: CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: PHP ${{ matrix.php }} Test Runner
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, openssl, json, mbstring
          coverage: none

      - name: Lint PHP Syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - name: Run Plugin Test Suite
        run: php tests/test-runner.php
